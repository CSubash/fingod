# Project-scoped MCP servers for Codex CLI. They load once you trust this project.
# Keep in step with .mcp.json (Claude Code), .gemini/settings.json (Gemini CLI) and .pi/mcp.json (Pi).
#
#   INDmoney: sign in once with   codex mcp login indmoney
#   Wallet:   export WALLET_MCP_TOKEN=<the whole token> before starting codex
#   Kite, Groww: the bridge needs Node 20.18.1 or newer; the login link appears on first use
#   Coinbase: sign in once with   codex mcp login coinbase
#   Binance:  export BINANCE_API_KEY and BINANCE_PRIVATE_KEY_PATH (or BINANCE_API_SECRET) before starting codex; needs uv

[mcp_servers.kite]
command = "npx"
args = ["-y", "mcp-remote", "https://mcp.kite.trade/mcp"]
# fingod is read-only: never expose Kite's order and GTT tools to the model.
disabled_tools = ["place_order", "modify_order", "cancel_order", "place_gtt_order", "modify_gtt_order", "delete_gtt_order"]

[mcp_servers.wallet]
url = "https://mcp.wallet.budgetbakers.com"
bearer_token_env_var = "WALLET_MCP_TOKEN"

[mcp_servers.indmoney]
url = "https://mcp.indmoney.com/mcp"

# Groww: official hosted server, stocks and F&O only. Its sign-in only accepts the callback of the
# bridge Groww documents (port 52155), so native OAuth would be rejected. It exposes ORDER tools whose names are not published, so they cannot be disabled here by name.
# After connecting, list its tools and add the order ones to disabled_tools (see docs/ONBOARDING.md).
[mcp_servers.groww]
command = "npx"
args = ["-y", "mcp-remote", "https://mcp.groww.in/mcp", "52155"]

# Coinbase: official hosted server, OAuth. It can trade, transfer and convert; fingod only reads.
[mcp_servers.coinbase]
url = "https://agents.coinbase.com/mcp"
disabled_tools = ["coinbase_orders_create", "coinbase_orders_edit", "coinbase_orders_cancel", "coinbase_orders_close_position", "coinbase_transfer", "coinbase_convert_execute", "coinbase_portfolios_create", "coinbase_portfolios_edit", "coinbase_portfolios_delete", "coinbase_x402_fetch", "coinbase_x402_pay"]

# Binance: no official server; a community one (PyPI amazing-binance-mcp), run with uv. Use an API key
# with ONLY "Enable Reading" ticked. Trading is off unless BINANCE_ALLOW_TRADING=1, which fingod never sets.
[mcp_servers.binance]
command = "uvx"
args = ["amazing-binance-mcp"]
env_vars = ["BINANCE_API_KEY", "BINANCE_PRIVATE_KEY_PATH", "BINANCE_API_SECRET"]
disabled_tools = ["binance_place_order", "binance_cancel_order", "binance_cancel_all_open_orders", "binance_cancel_replace_order", "binance_place_oco_order", "binance_place_oto_order", "binance_place_otoco_order", "binance_cancel_order_list", "binance_place_twap_order", "binance_cancel_algo_order", "binance_transfer_between_wallets", "binance_accept_convert_quote", "binance_place_convert_limit_order", "binance_cancel_convert_limit_order", "binance_convert_dust_to_bnb"]
